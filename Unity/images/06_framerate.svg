<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="725" viewBox="0 0 1400 725"><rect width="1400" height="725" fill="#F5F8FC"/><rect width="1400" height="9" fill="#2463A5"/><g font-family="sans-serif"><text x="55" y="75" font-size="32" font-weight="bold" fill="#142638">实时与离线：时间要求不同</text><text x="55" y="111" font-size="17" fill="#52677B">实时 / 离线描述时间预算；光栅化 / 路径追踪才是渲染算法</text><rect x="54" y="148" width="628" height="493" rx="18" fill="white" stroke="#D7E1EB" stroke-width="2"/><rect x="716" y="148" width="628" height="493" rx="18" fill="white" stroke="#D7E1EB" stroke-width="2"/><rect x="82" y="177" width="575" height="70" rx="12" fill="#E5F1FC"/><text x="110" y="222" font-size="26" fill="#2463A5" font-weight="bold">实时渲染</text><rect x="743" y="177" width="575" height="70" rx="12" fill="#E5F6F2"/><text x="772" y="222" font-size="26" fill="#117E77" font-weight="bold">离线逐帧渲染</text><rect x="82" y="292" width="575" height="82" rx="12" fill="#F0F5FB"/><text x="111" y="339" font-size="24" fill="#142638">60 FPS：每帧预算约 16.67 ms</text><rect x="743" y="292" width="575" height="82" rx="12" fill="#F0F8F5"/><text x="772" y="339" font-size="24" fill="#142638">一帧可以计算很长时间</text><rect x="82" y="414" width="575" height="82" rx="12" fill="#F0F5FB"/><text x="111" y="461" font-size="23" fill="#142638">玩家、镜头和画面持续响应</text><rect x="743" y="414" width="575" height="82" rx="12" fill="#F0F8F5"/><text x="772" y="461" font-size="23" fill="#142638">输出的视频仍可以播放为 60 FPS</text><text x="55" y="685" font-size="16" fill="#52677B">一帧预算不等于 GPU 渲染能占满全部帧时间。</text></g></svg>