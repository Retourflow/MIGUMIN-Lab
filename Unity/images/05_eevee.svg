<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="725" viewBox="0 0 1400 725"><rect width="1400" height="725" fill="#F5F8FC"/><rect width="1400" height="9" fill="#2463A5"/><g font-family="sans-serif"><text x="55" y="75" font-size="32" font-weight="bold" fill="#142638">EEVEE 不只是光栅化</text><text x="55" y="111" font-size="17" fill="#52677B">光栅化解决可见几何体的屏幕覆盖，完整画面还需要其他渲染技术</text><rect x="52" y="154" width="623" height="475" rx="18" fill="white" stroke="#D7E1EB" stroke-width="2"/><rect x="724" y="154" width="623" height="475" rx="18" fill="white" stroke="#D7E1EB" stroke-width="2"/><rect x="76" y="180" width="576" height="70" rx="12" fill="#E5F1FC"/><text x="106" y="222" font-size="25" fill="#2463A5">光栅化 / Rasterization</text><rect x="76" y="286" width="576" height="90" rx="12" fill="#F0F5FB"/><text x="103" y="338" font-size="25" fill="#142638">确定屏幕上的可见片元</text><rect x="76" y="406" width="576" height="90" rx="12" fill="#F0F5FB"/><text x="103" y="459" font-size="24" fill="#142638">交给材质与后续阶段</text><rect x="749" y="180" width="572" height="70" rx="12" fill="#E5F6F2"/><text x="780" y="222" font-size="25" fill="#117E77">构成最终画面的其他系统</text><rect x="749" y="286" width="572" height="90" rx="12" fill="#F0F8F5"/><text x="780" y="338" font-size="24" fill="#142638">Shader、直接光照与阴影</text><rect x="749" y="406" width="572" height="90" rx="12" fill="#F0F8F5"/><text x="780" y="459" font-size="24" fill="#142638">反射、间接光照与后期</text><text x="55" y="680" font-size="17" fill="#52677B">核心：以光栅化为基础，不等于只有光栅化，也不等于没有光照。</text></g></svg>