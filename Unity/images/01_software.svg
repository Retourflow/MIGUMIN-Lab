<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="760px" version="1.1" viewBox="0 0 1400 760" width="1400px">
<defs><path d="M0,0 L11,4 L0,8 Z" fill="#52677B"/><path d="M0,0 L11,4 L0,8 Z" fill="#2463A5"/><path d="M0,0 L11,4 L0,8 Z" fill="#BD4B4A"/></defs><rect fill="#F5F8FC" height="760" width="1400" x="0" y="0"/><rect fill="#2463A5" height="10" width="1400" x="0" y="0"/>
<text fill="#142638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" text-anchor="start" x="56" y="75">软件、渲染引擎与渲染管线：不是同一层概念</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="57" y="112">先看软件负责什么，再看它内部怎样渲染。</text>
<rect fill="#FFFFFF" height="490" rx="18" ry="18" stroke="#D7E1EB" stroke-width="1.6" width="380" x="55" y="155"/><rect fill="#2463A5" height="11" rx="5" width="380" x="55" y="155"/><text fill="#142638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" text-anchor="start" x="81" y="216">Blender</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="81" y="246">3D 内容创作软件</text><line stroke="#D7E1EB" stroke-linecap="round" stroke-width="1" x1="81" x2="409" y1="273" y2="273"/>
<rect fill="#FFFFFF" height="490" rx="18" ry="18" stroke="#D7E1EB" stroke-width="1.6" width="380" x="510" y="155"/><rect fill="#7657AF" height="11" rx="5" width="380" x="510" y="155"/><text fill="#142638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" text-anchor="start" x="536" y="216">Cinema 4D（C4D）</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="536" y="246">3D 内容创作软件</text><line stroke="#D7E1EB" stroke-linecap="round" stroke-width="1" x1="536" x2="864" y1="273" y2="273"/>
<rect fill="#FFFFFF" height="490" rx="18" ry="18" stroke="#D7E1EB" stroke-width="1.6" width="380" x="965" y="155"/><rect fill="#117E77" height="11" rx="5" width="380" x="965" y="155"/><text fill="#142638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" text-anchor="start" x="991" y="216">Unreal Engine（UE）</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="991" y="246">完整游戏引擎</text><line stroke="#D7E1EB" stroke-linecap="round" stroke-width="1" x1="991" x2="1319" y1="273" y2="273"/>
<rect fill="#E5F1FC" height="34" rx="17" ry="17" width="145" x="80" y="301"/><text fill="#2463A5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="152.5" y="325">内置渲染引擎</text><rect fill="#E5F1FC" height="98" rx="12" ry="12" width="330" x="80" y="360"/><text fill="#2463A5" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" text-anchor="start" x="105" y="399">EEVEE</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="105" y="431">以光栅化为基础</text><rect fill="#FFFFFF" height="98" rx="12" ry="12" stroke="#D7E1EB" stroke-width="1.6" width="330" x="80" y="482"/><text fill="#142638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" x="105" y="522">Cycles</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="105" y="554">以路径追踪为核心</text>
<rect fill="#F0EAFA" height="34" rx="17" ry="17" width="130" x="535" y="301"/><text fill="#7657AF" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="325">可用渲染器</text><rect fill="#F0EAFA" height="98" rx="12" ry="12" width="330" x="535" y="360"/><text fill="#7657AF" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" x="560" y="399">Redshift</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="560" y="431">以光追／路径追踪为核心</text><rect fill="#FFFFFF" height="98" rx="12" ry="12" stroke="#D7E1EB" stroke-width="1.6" width="330" x="535" y="482"/><text fill="#142638" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" x="560" y="524">其他渲染选项</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" x="560" y="555">依版本、设置而不同</text>
<rect fill="#E5F6F2" height="34" rx="17" ry="17" width="152" x="990" y="301"/><text fill="#117E77" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="1066" y="325">内置渲染系统</text><rect fill="#E5F6F2" height="220" rx="12" ry="12" width="330" x="990" y="360"/><text fill="#117E77" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="bold" x="1015" y="401">实时渲染</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" x="1015" y="443">常用光栅化及多种技术</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" x="1015" y="478">可以结合实时光线追踪</text><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" x="1015" y="513">也提供非实时路径追踪</text>
<line stroke="#D7E1EB" stroke-linecap="round" stroke-width="1" x1="56" x2="1344" y1="688" y2="688"/><text fill="#52677B" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" x="58" y="724">对比时先分清：Blender ↔ C4D；EEVEE ↔ Redshift；UE 是完整游戏引擎。</text></svg>