<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="725" viewBox="0 0 1400 725" role="img" aria-label="光栅化与路径追踪"><rect width="1400" height="725" fill="#F5F8FC"/><rect width="1400" height="10" fill="#2463A5"/><text x="56" y="75" font-size="32" font-weight="bold" fill="#142638" font-family="sans-serif">光栅化与路径追踪</text><text x="57" y="112" font-size="17" fill="#52677B" font-family="sans-serif">两种生成画面的核心策略，不代表能否计算光照</text><rect x="54" y="148" width="628" height="493" rx="18" fill="#FFF" stroke="#D7E1EB" stroke-width="2"/><rect x="82" y="170" width="560" height="48" rx="9" fill="#E5F1FC"/><text x="102" y="201" font-size="23" font-weight="bold" fill="#2463A5" font-family="sans-serif">光栅化</text><rect x="100" y="251" width="536" height="79" rx="10" fill="#F8FAFD" stroke="#D7E1EB"/><text x="118" y="298" font-size="22" fill="#142638" font-family="sans-serif">三维三角形投影到屏幕</text><rect x="100" y="363" width="536" height="79" rx="10" fill="#F0F5FB" stroke="#D7E1EB"/><text x="118" y="410" font-size="22" fill="#142638" font-family="sans-serif">确定被覆盖的片元</text><rect x="100" y="475" width="536" height="79" rx="10" fill="#F8FAFD" stroke="#D7E1EB"/><text x="118" y="522" font-size="22" fill="#142638" font-family="sans-serif">Shader 及其他算法完成画面</text><rect x="716" y="148" width="628" height="493" rx="18" fill="#FFF" stroke="#D7E1EB" stroke-width="2"/><rect x="744" y="170" width="560" height="48" rx="9" fill="#E5F6F2"/><text x="764" y="201" font-size="23" font-weight="bold" fill="#117E77" font-family="sans-serif">路径追踪</text><rect x="762" y="251" width="536" height="79" rx="10" fill="#F8FAFD" stroke="#D7E1EB"/><text x="780" y="298" font-size="22" fill="#142638" font-family="sans-serif">从摄像机采样光线</text><rect x="762" y="363" width="536" height="79" rx="10" fill="#F0F5FB" stroke="#D7E1EB"/><text x="780" y="410" font-size="22" fill="#142638" font-family="sans-serif">与表面求交、继续采样路径</text><rect x="762" y="475" width="536" height="79" rx="10" fill="#F8FAFD" stroke="#D7E1EB"/><text x="780" y="522"